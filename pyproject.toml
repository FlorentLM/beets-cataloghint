[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-cataloghint"
version = "0.0.9"
description = "Beets plugin to resolve an exact MusicBrainz release match"
authors = [
    {name = "Florent Le Moël", email = "25004801+FlorentLM@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "beets>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]

[tool.pytest.ini_options]
python_files = ["*_tests.py"]
